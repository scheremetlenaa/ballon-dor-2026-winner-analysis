  La Liga:              {name: La Liga, type: League, big_stage: false, tier: Major, weight: 2}
  Serie A:              {name: Serie A, type: League, big_stage: false, tier: Major, weight: 2}
  Bundesliga:           {name: Bundesliga, type: League, big_stage: false, tier: Major, weight: 2}
  Ligue 1:              {name: Ligue 1, type: League, big_stage: false, tier: Major, weight: 2}
  Champions Lg:         {name: UEFA Champions League, type: Continental, big_stage: true, tier: Major, weight: 3}
  Europa Lg:            {name: UEFA Europa League, type: Continental, big_stage: false, tier: Minor, weight: 1.5}
